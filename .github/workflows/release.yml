name: Build and release XPI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read and validate version
        id: metadata
        shell: bash
        run: |
          version="$(node -p "require('./manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$version" != "$package_version" ]]; then
            echo "manifest.json version ($version) does not match package.json ($package_version)" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "filename=zotero-collection-sorter-$version.xpi" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: npm test

      - name: Build XPI
        run: bash scripts/build-xpi.sh

      - name: Generate SHA-256
        shell: bash
        run: |
          cd dist
          sha256sum "${{ steps.metadata.outputs.filename }}" > "${{ steps.metadata.outputs.filename }}.sha256"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: collection-sorter-for-zotero-${{ steps.metadata.outputs.version }}
          path: |
            dist/${{ steps.metadata.outputs.filename }}
            dist/${{ steps.metadata.outputs.filename }}.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          XPI_FILENAME: ${{ steps.metadata.outputs.filename }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/$XPI_FILENAME" \
            "dist/$XPI_FILENAME.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Collection Sorter for Zotero $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
